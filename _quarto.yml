project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "students/*/index.qmd"
    - "publications/*.qmd"
    - "research/*.qmd"
  resources:
    - "students/*/photo.*"
  preview:
    port: 4321

website:
  title: "Causality Lab"
  site-url: https://migariane.github.io/CausalityMluquefeLab/
  description: >-
    Miguel Ángel Luque Fernández — causal inference, biostatistics, and
    computational epidemiology at the University of Granada.
  open-graph: true
  twitter-card:
    site: "@WATZILEI"
  navbar:
    background: light
    left:
      - text: "Home"
        href: index.qmd
      - text: "Research"
        href: research/index.qmd
      - text: "Team"
        href: students/index.qmd
      - text: "Publications"
        href: publications/index.qmd
      - text: "Talks"
        href: talks.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "Software"
        href: software.qmd
    right:
      - text: "ES"
        href: es/index.html
        aria-label: "Leer este sitio en español"
      - icon: github
        text: GitHub
        href: https://github.com/migariane
        aria-label: GitHub profile

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss]
    toc: false
    lang: en
    page-footer:
      left: "© 2026 Miguel Ángel Luque Fernández"
      center: "English version · [Español](es/index.html)"
      right: "Built with [Quarto](https://quarto.org)"
